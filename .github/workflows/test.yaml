name: CI
on:
  pull_request:
  push:
    branches-ignore:
      - 'dependabot/**'
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    name: Test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Nox
        uses: wntrblm/nox@a976d7ee04ab7a13634adc1016d4755a1348225f # 2026.08.17
        with:
          python-versions: '3.13, 3.14'
      - name: setup annotations for flake8 results
        uses: airtower-luna/flake8-annotations@d18e78ad3c57d81fe3c4d794f0de16ea46baa9f8 # node24
      - name: Run tests and linter
        run: |
          nox --report test-report.json
      - name: Run this action on the Nox report from tests
        if: always()
        uses: ./
        with:
          report: 'test-report.json'
          title: Self-test
